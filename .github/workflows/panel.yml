name: DPIBreak Panel

# Builds the single-file DPIBreak-Panel.exe (dpibreak.exe and WinDivert
# embedded) and uploads it as an artifact. Releases are published by
# hand from that artifact, so they carry the maintainer's name.

on:
  push:
    branches: [feature/gui]
    paths:
      - "gui/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/panel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build single-file panel
        shell: pwsh
        run: ./gui/build-bundle.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: DPIBreak-Panel
          path: dist/DPIBreak-Panel.exe
          if-no-files-found: error
