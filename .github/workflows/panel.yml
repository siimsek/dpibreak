name: DPIBreak Panel

# Checks and builds the single-file panels and uploads them as
# artifacts: DPIBreak-Panel.exe (dpibreak.exe and WinDivert embedded)
# and DPIBreak-Panel-linux-x86_64 (static dpibreak embedded). Releases
# are published by hand from these artifacts, so they carry the
# maintainer's name.

on:
  push:
    branches: [feature/gui, feature/gui-linux]
    paths:
      - "gui/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/panel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path gui/install-windows.ps1).Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Clippy (panel, plain build)
        run: cargo clippy --locked -p dpibreak-gui --all-targets -- -D warnings

      - name: Test panel
        run: cargo test --locked -p dpibreak-gui

      - name: Build single-file panel
        shell: pwsh
        run: ./gui/build-bundle.ps1

      - name: Clippy (panel, bundled build)
        shell: pwsh
        run: |
          $env:DPIBREAK_BUNDLE_DIR = (Resolve-Path target/bundle).Path
          cargo clippy --locked -p dpibreak-gui --all-targets -- -D warnings

      - uses: actions/upload-artifact@v4
        with:
          name: DPIBreak-Panel
          path: |
            dist/DPIBreak-Panel.exe
            dist/DPIBreak-Panel.exe.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Linux installer syntax
        run: sh -n gui/install-linux.sh

      - name: Clippy (panel, plain build)
        run: cargo clippy --locked -p dpibreak-gui --all-targets -- -D warnings

      - name: Test panel
        run: cargo test --locked -p dpibreak-gui

      - name: Build single-file panel
        run: sh gui/build-bundle.sh

      - name: Clippy (panel, bundled build)
        run: |
          DPIBREAK_BUNDLE_DIR="$PWD/target/bundle-linux" \
            cargo clippy --locked -p dpibreak-gui --all-targets -- -D warnings

      - uses: actions/upload-artifact@v4
        with:
          name: DPIBreak-Panel-linux-x86_64
          path: |
            dist/DPIBreak-Panel-linux-x86_64
            dist/DPIBreak-Panel-linux-x86_64.sha256
          if-no-files-found: error
